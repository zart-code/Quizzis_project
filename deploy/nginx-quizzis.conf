# Nginx-конфигурация для Quizzis.
#
# Весь трафик (HTTP и WebSocket) проксируется на Daphne, который умеет
# обрабатывать и обычные запросы, и постоянные WebSocket-соединения.
# Отдельный upstream для WS не нужен — Daphne один обслуживает оба
# протокола, но location /ws/ выделен, чтобы корректно пробросить
# заголовки Upgrade/Connection.

upstream quizzis_asgi {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name quizzis.ru www.quizzis.ru;

    client_max_body_size 10M;

    location /static/ {
        alias /path/to/Quizzis_project/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /path/to/Quizzis_project/media/;
    }

    # WebSocket-эндпоинты лобби/сессий.
    location /ws/ {
        proxy_pass http://quizzis_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket-соединения долгоживущие — увеличиваем таймауты.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Обычный HTTP-трафик.
    location / {
        proxy_pass http://quizzis_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
