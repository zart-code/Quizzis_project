{% extends "base.html" %}

{% block content %}
<form method="post" id="quiz-form">
    {% csrf_token %}

    <label for="quiz-title">Название квиза</label>
    <input type="text" id="quiz-title" name="title" required>
    <br><br>

    <div id="questions-container"></div>

    <button type="button" id="add-question-btn">+ Добавить вопрос</button>
    <br><br>
    <button type="submit">Создать</button>
</form>

<script>
    let count = 1;
    const labels = ['A', 'B', 'C', 'D'];
    const times = [15, 20, 30, 45, 60];

    function makeQuestion(i) {
        const answers = labels.map((l, j) => `
            <div>
                <input type="radio" name="q${i}_correct" value="${j}" id="q${i}c${j}">
                <label for="q${i}c${j}">${l}</label>
                <input type="text" name="q${i}_ans${j}" placeholder="Вариант ${l}" required>
            </div>`).join('');

        const timeOpts = times.map(t => `
            <label>
                <input type="radio" name="q${i}_time" value="${t}" ${t === 30 ? 'checked' : ''}>
                ${t} сек
            </label>`).join('');

        return `
            <div id="qblock${i}">
                <strong>Вопрос ${i}</strong><br>
                <input type="text" name="q${i}_text" placeholder="Текст вопроса" required>
                ${answers}
                <div><label>Время:</label> ${timeOpts}</div>
            </div><hr>`;
    }

    const container = document.getElementById('questions-container');
    container.innerHTML = makeQuestion(1);

    document.getElementById('add-question-btn').addEventListener('click', () => {
        count++;
        container.insertAdjacentHTML('beforeend', makeQuestion(count));
    });
</script>
{% endblock %}
