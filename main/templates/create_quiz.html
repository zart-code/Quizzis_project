{% extends "base.html" %}
{% load static %}

{% block title %}Создать квиз — Quizziz{% endblock %}

{% block content %}
<div class="container">
    <div class="cq-wrapper">
        <div class="cq-header">
            <h1 class="cq-title">✏️ Создание квиза</h1>
            <p class="cq-subtitle">Добавьте вопросы и запустите игру</p>
        </div>

        <form method="post" id="quiz-form">
            {% csrf_token %}
            <div class="card cq-title-card">
                <label class="cq-label" for="quiz-title">📚 Название квиза</label>
                <input type="text" id="quiz-title" name="title" class="form-control" placeholder="Введите название квиза..." required>
            </div>

            <div id="questions-container"></div>

            <div class="cq-add-row">
                <button type="button" id="add-question-btn" class="btn btn-secondary">+ Добавить вопрос</button>
            </div>

            <div class="cq-submit-row">
                <button type="submit" class="btn btn-primary btn-large">🚀 Создать и открыть лобби</button>
            </div>
        </form>
    </div>
</div>


{% endblock %}
