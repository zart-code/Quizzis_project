{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
    <h2>{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="{% url 'login_page' %}">Войдите</a></p>
{% endblock %}
