{% extends "base.html" %}

{% block title %}Вход - Quizziz{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Вход 🔐</h2>

            {% if form.errors %}
                <div style="color: red; margin-bottom: 15px;">
                    <p>Неверное имя пользователя или пароль.</p>
                </div>
            {% endif %}

            <form method="POST" class="auth-form">
                {% csrf_token %}

                <div class="form-group">
                    <label for="{{ form.username.id_for_label }}">Имя пользователя</label>
                    <input type="text"
                           name="{{ form.username.name }}"
                           id="{{ form.username.id_for_label }}"
                           value="{{ form.username.value|default:'' }}"
                           required
                           style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div class="form-group">
                    <label for="{{ form.password.id_for_label }}">Пароль</label>
                    <input type="password"
                           name="{{ form.password.name }}"
                           id="{{ form.password.id_for_label }}"
                           required
                           style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
                </div>

               <button type="submit" class="btn btn-primary btn-block">Войти</button>
            </form>

            <p class="auth-footer" style="margin-top: 15px; text-align: center;">
                Нет аккаунта? <a href="{% url 'register_page' %}">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
