{% extends "base.html" %}

{% block title %}Ожидание — {{ session.quiz.title }}{% endblock %}

{% block content %}
<h2>{{ session.quiz.title }}</h2>
<p>Вы подключились как: <strong>{{ request.user.username }}</strong></p>
<p>Ожидайте, хост скоро начнёт игру...</p>

<script>
    const apiUrl = "{% url 'api_state' session.pin %}";
    const playUrl = "/session/{{ session.pin }}/play/";

    setInterval(function () {
        fetch(apiUrl)
            .then(r => r.json())
            .then(data => {
                if (data.status === 'in_progress') {
                    window.location.href = playUrl;
                }
            });
    }, 2000);
</script>
{% endblock %}
