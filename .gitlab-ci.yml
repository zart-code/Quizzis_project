variables:
  GIT_STRATEGY: clone


image: python:3.13.3-alpine3.20

before_script:
  - python3 -m venv .venv
  - . .venv/bin/activate
  - pip install -r requirements.txt

stages:
  - style
  - test
  - docs
  - deploy


pylint:
  stage: style
  script:
    - pylint --fail-under=6 --ignore-paths="docs/*" **/*.py
    - echo "Pylint complete."
  artifacts:
    untracked: false
    when: on_success
    expire_in: 30 days


pycodestyle:
  stage: style
  script:
    - pycodestyle --max-line-length=120 **/*.py
    - echo "Pycodestyle complete."
  artifacts:
    untracked: false
    when: on_failure
    expire_in: 30 days


python:
  stage: test
  script:
    - .venv/bin/python manage.py test
    - echo "Tests complete."
  artifacts:
    untracked: false
    when: on_failure
    expire_in: 30 days


sphinx:
  stage: docs
  script:
    - pip install sphinx sphinx-rtd-theme
    - cd docs
    - sphinx-build -b html source build
    - echo "Sphinx documentation built."
  artifacts:
    paths:
      - docs/build/
    expire_in: 30 days
    when: on_success


deploy:
  stage: deploy
  only:
    - master
  script:
    - apk add --no-cache openssh rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
    - rsync -avz --delete
        --exclude='.git/'
        --exclude='venv/'
        --exclude='__pycache__/'
        --exclude='*.pyc'
        --exclude='static/'
        --exclude='media/'
        --exclude='.env'
        --exclude='.idea/'
        --exclude='.vscode/'
        --exclude='gunicorn.log'
        --exclude='logs/'
        --exclude='db.sqlite3'
        ./
        $DEPLOY_USER@$DEPLOY_HOST:/home/site1/app/quizzis_project/
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        cd /home/site1/app/quizzis_project &&
        source /home/site1/app/venv/bin/activate &&
        pip install -r requirements.txt &&
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        export XDG_RUNTIME_DIR=/run/user/\$(id -u) &&
        systemctl --user restart quizzis
      "
    - echo "Deploy completed."
  environment:
    name: production
    url: http://188.127.251.236:8081
  when: on_success
