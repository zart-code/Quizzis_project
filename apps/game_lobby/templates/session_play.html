{% extends "base.html" %}
{% load static %}

{% block title %}{{ session.quiz.title }}{% endblock %}

{% block content %}
<div class="container">
    <div class="sp-wrapper">
        <div class="sp-header">
            <div class="sp-quiz-title">{{ session.quiz.title }}</div>
            <div class="sp-progress-row">
                <span class="sp-progress-text">Вопрос <span id="sp-q-num">{{ index|add:1 }}</span> из <span id="sp-q-total">{{ total }}</span></span>
            </div>
        </div>

        <!-- Сюда отрисовывается вопрос или экран ожидания (меняется на месте) -->
        <div id="sp-content"></div>
    </div>
</div>

<style>
.sp-wrapper{max-width:700px;margin:0 auto;padding:2rem 0}
.sp-header{margin-bottom:1.5rem}
.sp-quiz-title{font-size:1rem;color:var(--text-muted);text-align:center;margin-bottom:.5rem}
.sp-progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.sp-progress-text{color:var(--text-secondary);font-size:.9rem;font-weight:500}
.sp-score{color:var(--accent);font-weight:700;font-size:1rem}
.sp-question-card{padding:2rem}
.sp-timer-row{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
.sp-timer-bar-bg{flex:1;height:8px;background:rgba(139,92,246,.15);border-radius:10px;overflow:hidden}
.sp-timer-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:10px;transition:width 1s linear}
.sp-timer-num{font-size:1.4rem;font-weight:700;color:var(--primary-light);min-width:2.5rem;text-align:right}
.sp-question-text{font-size:1.4rem;font-weight:600;color:var(--text-primary);margin-bottom:1.5rem;line-height:1.4;text-align:center}
.sp-answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:1.5rem}
@media(max-width:500px){.sp-answers-grid{grid-template-columns:1fr}}
.sp-answer-label{display:flex;align-items:center;gap:.8rem;background:rgba(139,92,246,.08);border:2px solid rgba(139,92,246,.2);border-radius:14px;padding:1rem 1.2rem;cursor:pointer;transition:all .2s}
.sp-answer-letter{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:rgba(139,92,246,.2);color:var(--primary-light);font-weight:700;font-size:.85rem;flex-shrink:0}
.sp-answer-label:hover{background:rgba(139,92,246,.18);border-color:var(--primary)}
.sp-answer-label:has(.sp-radio:checked),.sp-answer-label:has(.sp-check:checked){background:rgba(139,92,246,.25);border-color:var(--primary-light)}
.sp-radio,.sp-check{width:18px;height:18px;accent-color:var(--primary);flex-shrink:0}
.sp-answer-text{color:var(--text-primary);font-size:.95rem}
.sp-input-row{margin-bottom:1.5rem}
.sp-hint{color:var(--text-muted);font-size:.85rem;margin-top:.5rem;font-style:italic}
.sp-submit-row{text-align:center}
.sp-waiting-card{padding:3rem 2rem;text-align:center}
.sp-waiting-icon{font-size:3rem;margin-bottom:1rem}
.sp-waiting-title{font-size:1.5rem;font-weight:700;color:var(--primary-light);margin-bottom:.5rem}
.sp-waiting-sub{color:var(--text-secondary)}
.sp-waiting-dots{display:flex;justify-content:center;gap:.5rem;margin-top:1.5rem}
.sp-waiting-dots span{width:10px;height:10px;background:var(--primary);border-radius:50%;animation:bounce 1.2s infinite}
.sp-waiting-dots span:nth-child(2){animation-delay:.2s}
.sp-waiting-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
</style>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/lobby_ws.js' %}"></script>
<script>
(function(){
    "use strict";

    const PIN = "{{ session.pin }}";
    const SUBMIT_URL = "{{ submit_url }}";
    const RESULTS_URL = "/session/{{ session.pin }}/play/";
    const CSRF = "{{ csrf_token }}";
    const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    // Начальное состояние (с сервера при первой загрузке страницы).
    const INITIAL = {
        index: {{ index }},
        answered: {{ answered|yesno:"true,false" }},
        time_remaining: {{ remaining_seconds }},
    };

    const content = document.getElementById('sp-content');
    const qNumEl = document.getElementById('sp-q-num');
    const qTotalEl = document.getElementById('sp-q-total');

    let currentIndex = INITIAL.index;   // какой вопрос сейчас на экране
    let answered = INITIAL.answered;    // ответил ли игрок на текущий
    let timerId = null;                 // id таймера обратного отсчёта
    let navigatingAway = false;         // уходим на страницу результатов

    // Не пускаем игрока случайно закрыть вкладку во время игры.
    function beforeUnloadHandler(e){
        if (navigatingAway) return;
        e.preventDefault();
        e.returnValue = 'Вы точно хотите выйти? Сейчас идёт игра!';
    }
    window.addEventListener('beforeunload', beforeUnloadHandler);

    function clearTimer(){
        if (timerId){ clearInterval(timerId); timerId = null; }
    }

    // ── Экран ожидания (ответ принят, ждём учителя) ──
    function renderWaiting(){
        clearTimer();
        content.innerHTML =
            '<div class="card sp-waiting-card">' +
              '<div class="sp-waiting-icon">⏳</div>' +
              '<h2 class="sp-waiting-title">Ответ принят!</h2>' +
              '<p class="sp-waiting-sub">Ожидайте, учитель переключит на следующий вопрос...</p>' +
              '<div class="sp-waiting-dots"><span></span><span></span><span></span></div>' +
            '</div>';
    }

    // ── Экран вопроса ──
    function renderQuestion(q, timeRemaining){
        clearTimer();
        qNumEl.textContent = q.number;

        let answersHtml = '';
        if (q.type === 'single' || q.type === 'multiple') {
            const inputType = q.type === 'single' ? 'radio' : 'checkbox';
            const inputClass = q.type === 'single' ? 'sp-radio' : 'sp-check';
            answersHtml = '<div class="sp-answers-grid">' +
                q.options.map(function(opt, i){
                    return '<label class="sp-answer-label">' +
                        '<span class="sp-answer-letter">' + (LETTERS[i] || '') + '</span>' +
                        '<input type="' + inputType + '" name="answer" value="' + opt.id + '" class="' + inputClass + '"' +
                            (q.type === 'single' ? ' required' : '') + '>' +
                        '<span class="sp-answer-text">' + escapeHtml(opt.text) + '</span>' +
                    '</label>';
                }).join('') +
            '</div>';
        } else if (q.type === 'number') {
            answersHtml = '<div class="sp-input-row">' +
                '<input type="number" step="any" name="answer_number" class="form-control" placeholder="Введите число..." required>' +
            '</div>';
        } else if (q.type === 'text') {
            answersHtml = '<div class="sp-input-row">' +
                '<input type="text" name="answer_text" class="form-control" placeholder="Введите ответ...">' +
                '<p class="sp-hint">💬 Проверяется вручную</p>' +
            '</div>';
        }

        const timerHtml = q.time_limit
            ? '<div class="sp-timer-row">' +
                '<div class="sp-timer-bar-bg"><div class="sp-timer-bar" id="timer-bar"></div></div>' +
                '<span class="sp-timer-num" id="timer">' + timeRemaining + '</span>' +
              '</div>'
            : '';

        content.innerHTML =
            '<div class="card sp-question-card">' +
                timerHtml +
                '<h2 class="sp-question-text">' + escapeHtml(q.text) + '</h2>' +
                '<form id="answer-form">' +
                    '<input type="hidden" name="timed_out" value="0" id="timed-out-field">' +
                    answersHtml +
                    '<div class="sp-submit-row">' +
                        '<button type="submit" class="btn btn-primary btn-large">✅ Ответить</button>' +
                    '</div>' +
                '</form>' +
            '</div>';

        const form = document.getElementById('answer-form');
        form.addEventListener('submit', function(e){
            e.preventDefault();
            submitAnswer(form, false);
        });

        // Таймер обратного отсчёта (локальный, ничего не опрашивает).
        if (q.time_limit) {
            const totalTime = q.time_limit;
            const timerEl = document.getElementById('timer');
            const bar = document.getElementById('timer-bar');
            let remaining = timeRemaining;
            if (bar) bar.style.width = (remaining / totalTime * 100) + '%';
            timerId = setInterval(function(){
                remaining--;
                if (timerEl) timerEl.textContent = remaining;
                if (bar) bar.style.width = Math.max(0, remaining / totalTime * 100) + '%';
                if (remaining <= 5 && bar) bar.style.background = 'linear-gradient(90deg,#EF4444,#F59E0B)';
                if (remaining <= 0){
                    clearTimer();
                    document.getElementById('timed-out-field').value = '1';
                    submitAnswer(form, true);
                }
            }, 1000);
        }
    }

    // ── Отправка ответа через fetch (без перезагрузки) ──
    function submitAnswer(form, timedOut){
        if (answered) return;
        answered = true;          // блокируем повторную отправку
        clearTimer();

        const data = new FormData(form);
        if (timedOut) data.set('timed_out', '1');

        fetch(SUBMIT_URL, {
            method: 'POST',
            headers: { 'X-CSRFToken': CSRF },
            body: data
        })
        .then(function(r){ return r.json(); })
        .then(function(res){
            renderWaiting();
        })
        .catch(function(err){
            console.error('Ошибка отправки ответа:', err);
            // Разрешаем повторить при сетевой ошибке.
            answered = false;
        });
    }

    // ── Применяем состояние, пришедшее по WebSocket ──
    function applyState(data){
        if (data.kicked){
            navigatingAway = true;
            window.removeEventListener('beforeunload', beforeUnloadHandler);
            window.location.href = '/?kicked=1';
            return;
        }

        if (data.total_questions) qTotalEl.textContent = data.total_questions;

        // Игра завершена — переходим на страницу результатов (одна навигация).
        if (data.status === 'finished'){
            navigatingAway = true;
            window.removeEventListener('beforeunload', beforeUnloadHandler);
            window.location.href = RESULTS_URL;
            return;
        }

        if (data.status !== 'in_progress' || !data.question){
            return;
        }

        // Вопрос сменился ИЛИ это первый рендер.
        if (data.question.index !== currentIndex){
            currentIndex = data.question.index;
            answered = data.has_answered;
        } else {
            answered = data.has_answered;
        }

        if (answered){
            renderWaiting();
        } else {
            renderQuestion(data.question, data.time_remaining);
        }
    }

    // ── Одно WebSocket-соединение на всю игру ──
    const ws = new LobbyWebSocket(PIN);
    ws.on('player_state', applyState);
    // Учитель переключил вопрос — сервер пришлёт свежий player_state,
    // но на всякий случай запрашиваем синхронизацию.
    ws.on('question_advanced', function(){ ws.sync(); });
    ws.on('game_started', function(){ ws.sync(); });
    ws.on('kicked', function(){
        navigatingAway = true;
        window.removeEventListener('beforeunload', beforeUnloadHandler);
        window.location.href = '/?kicked=1';
    });

    // Если страницу восстановили из bfcache — пересинхронизируемся.
    window.addEventListener('pageshow', function(e){
        if (e.persisted) ws.sync();
    });
})();
</script>
{% endblock %}
