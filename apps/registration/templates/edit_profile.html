{% extends "base.html" %}
{% load static %}

{% block title %}Редактировать профиль - Quizziz{% endblock %}

{% block content %}
<div class="container">
    <div class="edit-profile-page">
        <div class="edit-profile-card">
            <h2 class="edit-profile-title">Редактировать профиль</h2>

            <form method="POST" class="edit-profile-form">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text"
                           id="username"
                           name="username"
                           class="form-control"
                           value="{{ edited_user.username }}"
                           required>
                </div>


                <div class="form-group">
                    <label for="password">Новый пароль</label>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           minlength="8"
                           required>
                    <small class="form-hint">Минимум 8 символов</small>
                </div>

                <div class="form-group">
                    <label for="password_confirm">Подтвердите пароль</label>
                    <input type="password"
                           id="password_confirm"
                           name="password_confirm"
                           class="form-control"
                           minlength="8"
                           required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-large">Сохранить изменения</button>
                    {% if is_admin_edit %}
                        <a href="{% url 'admin_user_profile' edited_user.id %}" class="btn btn-secondary btn-large">Отмена</a>
                    {% else %}
                        <a href="{% url 'profile' %}" class="btn btn-secondary btn-large">Отмена</a>
                    {% endif %}
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.edit-profile-page {
    max-width: 600px;
    margin: 0 auto;
    padding: 2rem 0;
}

.edit-profile-card {
    background: rgba(26, 26, 46, 0.8);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 3rem;
    box-shadow: 0 8px 32px rgba(139, 92, 246, 0.3);
    border: 1px solid rgba(139, 92, 246, 0.3);
}

.edit-profile-title {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 2.5rem;
    background: linear-gradient(135deg, var(--primary-light) 0%, var(--secondary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.edit-profile-form {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.form-divider {
    display: flex;
    align-items: center;
    text-align: center;
    margin: 1rem 0;
}

.form-divider span {
    padding: 0 1rem;
    color: var(--text-secondary);
    font-size: 0.9rem;
    background: rgba(26, 26, 46, 0.8);
    position: relative;
}

.form-divider::before,
.form-divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid rgba(139, 92, 246, 0.2);
}

.form-hint {
    display: block;
    margin-top: 0.5rem;
    color: var(--text-muted);
    font-size: 0.85rem;
}

.form-actions {
    display: flex;
    gap: 1rem;
    margin-top: 1.5rem;
}

.form-actions .btn {
    flex: 1;
}

@media (max-width: 600px) {
    .form-actions {
        flex-direction: column;
    }

    .edit-profile-card {
        padding: 2rem 1.5rem;
    }
}
</style>

<script>
// Валидация формы
document.querySelector('.edit-profile-form').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('password_confirm').value;

    if (password || confirmPassword) {
        if (password !== confirmPassword) {
            e.preventDefault();
            alert('Пароли не совпадают!');
            return false;
        }

        if (password.length < 8) {
            e.preventDefault();
            alert('Пароль должен быть не менее 8 символов!');
            return false;
        }
    }
});
</script>
{% endblock %}
